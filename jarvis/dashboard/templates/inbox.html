{% extends "base.html" %}
{% block title %}Jarvis — Inbox{% endblock %}
{% block content %}
    <h1>Inbox</h1>
    <p class="date-sub" id="count-sub">&nbsp;</p>
    <div class="error-banner" id="error-banner" style="display:none"></div>

    <div class="card">
      <form id="quick-capture-form" class="row">
        <input type="text" id="quick-capture-text" placeholder="Capture a thought...">
        <button type="submit" class="primary">Capture</button>
      </form>
    </div>

    <div class="card">
      <div class="row filter-row">
        <select id="filter-status"></select>
        <select id="filter-type"></select>
        <select id="filter-project"></select>
      </div>
      <ul class="capture-list" id="capture-list"></ul>
    </div>
{% endblock %}
{% block scripts %}<script src="/static/inbox.js"></script>{% endblock %}
