{% extends "base.html" %}
{% block title %}Jarvis — Home{% endblock %}
{% block content %}
    <div class="error-banner" id="error-banner" style="display:none"></div>

    <div class="life-clock">
      <div class="life-ring-wrap">
        <svg class="life-ring" viewBox="0 0 180 180">
          <circle class="life-ring-track" cx="90" cy="90" r="78"></circle>
          <circle class="life-ring-progress" id="lc-ring" cx="90" cy="90" r="78"></circle>
        </svg>
        <div class="life-ring-center">
          <div class="life-ring-pct" id="lc-pct">—</div>
          <div class="life-ring-pct-label">of an assumed life</div>
        </div>
      </div>

      <p class="life-clock-label">Time lived</p>
      <div class="life-stats">
        <div class="life-stat"><div class="life-stat-value" id="lc-years">—</div><div class="life-stat-label">Years</div></div>
        <div class="life-stat"><div class="life-stat-value" id="lc-months">—</div><div class="life-stat-label">Months</div></div>
        <div class="life-stat"><div class="life-stat-value" id="lc-days">—</div><div class="life-stat-label">Days</div></div>
        <div class="life-stat"><div class="life-stat-value" id="lc-hours">—</div><div class="life-stat-label">Hours</div></div>
        <div class="life-stat"><div class="life-stat-value" id="lc-minutes">—</div><div class="life-stat-label">Min</div></div>
        <div class="life-stat"><div class="life-stat-value" id="lc-seconds">—</div><div class="life-stat-label">Sec</div></div>
      </div>

      <div class="life-clock-remaining">
        <p class="life-clock-label">Estimated time remaining</p>
        <div class="life-clock-remaining-value" id="lc-remaining">&nbsp;</div>
        <form id="lifespan-form" class="life-clock-lifespan-form">
          <label for="lifespan-input">assuming a lifespan of</label>
          <input type="number" id="lifespan-input" min="1" step="1">
          <span>years total</span>
          <button type="submit">Save</button>
        </form>
      </div>
    </div>
{% endblock %}
{% block scripts %}<script src="/static/life-clock.js"></script>{% endblock %}
